name: Update profile releases

on:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update-profile.mjs
      - scripts/update-profile.test.mjs
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile-releases
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'UtenKekkoDev/UtenKekkoDev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release updater
        run: node --test scripts/update-profile.test.mjs
      - name: Read public releases
        env:
          PROFILE_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-profile.mjs
      - name: Commit only updated release content
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git add -- README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh public releases'
          git push origin HEAD:main
